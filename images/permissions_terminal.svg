<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <rect width="940" height="560" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="940" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="310" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: Linux FHS Directory &amp; Advanced Permissions</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Command 1: mkdir -->
    <text x="24" y="66" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="66" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="240" y="66" fill="rgb(56, 189, 248)">sudo mkdir -p /var/www/my-app/public /var/www/my-app/logs</text>

    <!-- Command 2: chmod -->
    <text x="24" y="104" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="104" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="240" y="104" fill="rgb(56, 189, 248)">sudo chmod 750 /var/www/my-app/public</text>

    <text x="24" y="142" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="142" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="240" y="142" fill="rgb(56, 189, 248)">sudo chmod 770 /var/www/my-app/logs</text>

    <!-- Command 3: chown -->
    <text x="24" y="180" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="180" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="240" y="180" fill="rgb(56, 189, 248)">sudo chown -R devops:www-data /var/www/my-app</text>

    <!-- Command 4: ls -la -->
    <text x="24" y="218" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="218" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="240" y="218" fill="rgb(56, 189, 248)">ls -la /var/www/my-app</text>

    <!-- Output lines -->
    <text x="24" y="246" fill="rgb(203, 213, 225)">total 16</text>
    <text x="24" y="270" fill="rgb(203, 213, 225)">drwxr-xr-x 4 devops www-data 4096 Oct  7 18:30 .</text>
    <text x="24" y="294" fill="rgb(203, 213, 225)">drwxr-xr-x 3 root   root     4096 Oct  7 18:28 ..</text>

    <!-- Highlighted row 1: logs 770 -->
    <rect x="20" y="306" width="900" height="26" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="24" y="324" fill="#22c55e" font-weight="bold">drwxrwx---</text>
    <text x="135" y="324" fill="rgb(203, 213, 225)"> 2 </text>
    <text x="155" y="324" fill="#38bdf8" font-weight="bold">devops</text>
    <text x="215" y="324" fill="#f59e0b" font-weight="bold">www-data</text>
    <text x="295" y="324" fill="rgb(203, 213, 225)"> 4096 Oct  7 18:30 </text>
    <text x="475" y="324" fill="#22c55e" font-weight="bold">logs</text>
    <text x="560" y="324" fill="#94a3b8">(Quyen 770: Owner &amp; Group toan quyen, Others cam)</text>

    <!-- Highlighted row 2: public 750 -->
    <rect x="20" y="336" width="900" height="26" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="24" y="354" fill="#38bdf8" font-weight="bold">drwxr-x---</text>
    <text x="135" y="354" fill="rgb(203, 213, 225)"> 2 </text>
    <text x="155" y="354" fill="#38bdf8" font-weight="bold">devops</text>
    <text x="215" y="354" fill="#f59e0b" font-weight="bold">www-data</text>
    <text x="295" y="354" fill="rgb(203, 213, 225)"> 4096 Oct  7 18:30 </text>
    <text x="475" y="354" fill="#38bdf8" font-weight="bold">public</text>
    <text x="560" y="354" fill="#94a3b8">(Quyen 750: Owner toan quyen, Group doc, Others cam)</text>

    <!-- Verification test command -->
    <text x="24" y="400" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="400" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="240" y="400" fill="rgb(56, 189, 248)">stat -c "%a %A %U:%G %n" /var/www/my-app/*</text>
    <text x="24" y="428" fill="#22c55e" font-weight="bold">770 drwxrwx--- devops:www-data /var/www/my-app/logs</text>
    <text x="24" y="452" fill="#38bdf8" font-weight="bold">750 drwxr-x--- devops:www-data /var/www/my-app/public</text>

    <text x="24" y="500" fill="rgb(34, 197, 94)">devops@ubuntu-server</text>
    <text x="200" y="500" fill="rgb(248, 250, 252)">:~$ </text>
  </g>
</svg>
